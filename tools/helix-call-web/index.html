<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>HELIX</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<style>
  :root{--bg:#0e1116;--card:#171c26;--fg:#e9edf5;--dim:#8b97ab;--line:#242c3a;--acc:#3b82f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
       overflow:hidden;user-select:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;
          padding:max(14px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  .screen.on{display:flex}

  /* ---- dialer ---- */
  .who{text-align:center;padding:28px 0 10px}
  .avatar{width:78px;height:78px;border-radius:50%;margin:0 auto 14px;
          background:linear-gradient(140deg,#3b82f6,#8b5cf6);display:grid;place-items:center;font-size:30px}
  .name{font-size:23px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px;justify-content:center;margin:18px 0}
  .key{height:74px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);
       font-size:27px;display:grid;place-items:center;cursor:pointer}
  .key:active{background:#243044}
  .key small{display:block;font-size:9px;letter-spacing:1.6px;color:var(--dim);margin-top:-6px}
  .rowbtns{display:flex;gap:26px;justify-content:center;margin-top:auto;padding-bottom:12px}
  .circ{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);background:var(--card);
        display:grid;place-items:center;font-size:22px;cursor:pointer}
  .call{width:66px;height:66px;border-radius:50%;border:none;background:#22c55e;color:#04240f;
        display:grid;place-items:center;cursor:pointer}

  /* ---- in call ---- */
  .incall{background:radial-gradient(120% 80% at 50% 0%,#1d2b45 0%,#0e1116 65%)}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .big{width:104px;height:104px;border-radius:50%;margin-bottom:18px;
       background:linear-gradient(140deg,#3b82f6,#8b5cf6);display:grid;place-items:center;font-size:42px;
       box-shadow:0 0 0 0 rgba(59,130,246,.5)}
  .big.ringing{animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 26px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
  .cname{font-size:28px;font-weight:600}
  .cstat{color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
  .transcript{flex:0 0 auto;max-height:34vh;overflow-y:auto;padding:10px 2px;
              -webkit-overflow-scrolling:touch;user-select:text}
  .t{padding:9px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);
     margin:7px 0;max-width:86%;font-size:14px}
  .t.me{align-self:flex-end;background:#1d3a63;margin-left:auto}
  .t b{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:2px}
  .controls{display:flex;gap:18px;justify-content:center;align-items:center;padding-top:14px}
  .ctl{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);
       display:grid;place-items:center;font-size:21px;cursor:pointer}
  .ctl.off{background:#7f1d1d;border-color:#7f1d1d}
  .hang{width:58px;height:58px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:22px;cursor:pointer}
  .hint{color:var(--dim);font-size:12px;text-align:center;padding-top:10px}
</style>
</head>
<body>

<!-- ================= DIALER ================= -->
<section id="dialer" class="screen on">
  <div class="who">
    <div class="avatar">H</div>
    <div class="name">HELIX</div>
    <div class="sub">always-on telephone &middot; me-abudhabi-1</div>
  </div>
  <div class="pad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2" >2<small>ABC</small></button>
    <button class="key" data-k="3">3<small>DEF</small></button>
    <button class="key" data-k="4">4<small>GHI</small></button>
    <button class="key" data-k="5">5<small>JKL</small></button>
    <button class="key" data-k="6">6<small>MNO</small></button>
    <button class="key" data-k="7">7<small>PQRS</small></button>
    <button class="key" data-k="8">8<small>TUV</small></button>
    <button class="key" data-k="9">9<small>WXYZ</small></button>
    <button class="key" data-k="*">*</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="#">#</button>
  </div>
  <div class="rowbtns">
    <div class="circ" id="padback" title="backspace">⌫</div>
    <button class="call" id="startcall" title="call HELIX">📞</button>
  </div>
  <div class="hint">Tap the green phone to talk to HELIX</div>
</section>

<!-- ================= IN CALL ================= -->
<section id="incall" class="screen incall">
  <div class="top">
    <span id="net">connecting</span>
    <span id="clock"></span>
  </div>
  <div class="center">
    <div class="big ringing" id="face">H</div>
    <div class="cname">HELIX</div>
    <div class="cstat" id="cstat">calling…</div>
  </div>
  <div class="transcript" id="log"></div>
  <div class="controls">
    <button class="ctl" id="mute" title="mute">🎤</button>
    <button class="ctl" id="spk"  title="speaker">🔊</button>
    <button class="hang"  id="hangup" title="end call">📵</button>
  </div>
</section>

<script src="/app/app.js"></script>
</body>
</html>
