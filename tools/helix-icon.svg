<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="core" cx="50%" cy="46%" r="52%">
      <stop offset="0%"   stop-color="#eafcff"/>
      <stop offset="38%"  stop-color="#4fd8ee"/>
      <stop offset="78%"  stop-color="#1d7f99"/>
      <stop offset="100%" stop-color="#0a2230"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="55%"  stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="#060910"/>

  <!-- connector stubs, matching the console's node pills -->
  <g stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" opacity=".85">
    <path d="M16 44 H40"/>
    <path d="M16 64 H34"/>
    <path d="M16 84 H40"/>
  </g>
  <g fill="#f59e0b"><circle cx="42" cy="44" r="3.6"/></g>
  <g fill="#22c55e"><circle cx="36" cy="64" r="3.6"/></g>
  <g fill="#7d8b99"><circle cx="42" cy="84" r="3.6"/></g>

  <circle cx="82" cy="64" r="40" fill="url(#halo)"/>
  <circle cx="82" cy="64" r="25" fill="url(#core)"/>

  <!-- latitude/longitude wireframe -->
  <g fill="none" stroke="#d6f7ff" stroke-width="1.5" opacity=".55">
    <ellipse cx="82" cy="64" rx="25" ry="9"/>
    <ellipse cx="82" cy="64" rx="25" ry="17"/>
    <ellipse cx="82" cy="64" rx="9"  ry="25"/>
    <ellipse cx="82" cy="64" rx="17" ry="25"/>
  </g>

  <!-- scanning rings -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" opacity=".7">
    <ellipse cx="82" cy="64" rx="31" ry="11" transform="rotate(-22 82 64)"/>
    <ellipse cx="82" cy="64" rx="31" ry="11" transform="rotate(28 82 64)"/>
  </g>

  <circle cx="82" cy="64" r="4.5" fill="#ffffff"/>
</svg>
