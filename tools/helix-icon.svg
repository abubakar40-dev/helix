<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1826"/>
      <stop offset="55%"  stop-color="#070d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="sphere" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="18%"  stop-color="#c9f4ff"/>
      <stop offset="46%"  stop-color="#4fd8ee"/>
      <stop offset="78%"  stop-color="#1a6f8c"/>
      <stop offset="100%" stop-color="#07202e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="46%"  stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="74%"  stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="88%"  stop-color="#6366f1" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- app plate -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#plate)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none"
        stroke="#1d3346" stroke-width="1.5"/>

  <!-- faint circuit grid, reads as a HUD not a sticker -->
  <g stroke="#16354a" stroke-width="1" opacity=".55">
    <path d="M8 74 H248 M8 128 H248 M8 182 H248"/>
    <path d="M74 8 V248 M128 8 V248 M182 8 V248"/>
  </g>
  <g fill="#22d3ee" opacity=".30">
    <circle cx="74" cy="74" r="2.5"/><circle cx="182" cy="74" r="2.5"/>
    <circle cx="74" cy="182" r="2.5"/><circle cx="182" cy="182" r="2.5"/>
  </g>

  <!-- glow + orb -->
  <circle cx="128" cy="128" r="86" fill="url(#halo)"/>
  <circle cx="128" cy="128" r="50" fill="url(#sphere)"/>

  <!-- wireframe latitude / longitude -->
  <g fill="none" stroke="#eafcff" stroke-width="2.1" opacity=".62">
    <ellipse cx="128" cy="128" rx="50" ry="17"/>
    <ellipse cx="128" cy="128" rx="50" ry="33"/>
    <ellipse cx="128" cy="128" rx="17" ry="50"/>
    <ellipse cx="128" cy="128" rx="33" ry="50"/>
  </g>

  <!-- orbiting rings -->
  <ellipse cx="128" cy="128" rx="74" ry="26" fill="none" stroke="url(#ring)"
           stroke-width="4.5" opacity=".92" transform="rotate(-24 128 128)"/>
  <ellipse cx="128" cy="128" rx="74" ry="26" fill="none" stroke="url(#ring)"
           stroke-width="3" opacity=".45" transform="rotate(34 128 128)"/>

  <!-- travelling energy node -->
  <circle cx="196" cy="99" r="8" fill="#eafcff"/>
  <circle cx="196" cy="99" r="13" fill="#22d3ee" opacity=".35"/>

  <!-- bright core -->
  <circle cx="128" cy="128" r="9" fill="#ffffff"/>
</svg>
