<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELIX</title>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#05080d; --panel:#0a1017; --panel2:#0d151e; --line:#16222e;
  --ink:#c9d6e2; --dim:#5c6b7a; --hi:#e8f2fb;
  --cy:#22d3ee; --am:#f59e0b; --gr:#22c55e; --rd:#ef4444; --vi:#a78bfa;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
/* ── title bar ─────────────────────────────────────────── */
/* 35px exactly: the reference title bar is 0,0 1509x35 and must not eat
   workspace height. */
#top{
  height:35px;flex:0 0 35px;display:flex;align-items:center;gap:12px;
  padding:0 14px;border-bottom:1px solid var(--line);background:#070c12;
}
#brand{font-weight:700;letter-spacing:.14em;color:var(--hi)}
#brand b{color:var(--cy)}
.ver{margin-left:auto;color:var(--dim);font-size:11px;display:flex;gap:14px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.on{background:var(--gr);box-shadow:0 0 8px var(--gr)}
.dot.warn{background:var(--am)}.dot.err{background:var(--rd)}

/* ── grid ──────────────────────────────────────────────── */
/* Proportions measured off the reference screenshot rather than eyeballed:
     left 310/1500 = 20.7% | centre 670/1500 = 44.7% | right 465/1500 = 31.0%
   Mine were 22.4 / 51.5 / 25.4, so the chat column was 5.6 points too narrow
   and the centre 6.8 points too wide. fr units (not %) so the 8px gaps are
   absorbed proportionally instead of eating into the last column. */
/* Reference 1509x812: left 12,47 316x752 | centre 340,47 643x752 | right 995,47 504x752
   => 12px outer margin, 12px gaps, tracks 316 / 643 / 504. The left rail spans
   BOTH rows; the centre is an upper composition + Agent Town (307 / 433 with a
   12px gap = 752). Rows use fr so the split survives other viewport heights. */
main{
  flex:1;min-height:0;display:grid;gap:12px;padding:12px 10px 12px 12px;
  /* fr, not percentages: percentages resolve against the CONTENT box (1485px),
     not against the post-gap width, so they overflow by the gap width. fr
     divides the true post-gap space and lands the left column on 316 exactly,
     with centre/right within 1px. */
  grid-template-columns:minmax(0,316fr) minmax(0,643fr) minmax(0,504fr);
  grid-template-rows:minmax(0,41.43fr) minmax(0,58.57fr);
  grid-template-areas:"left top console" "left town console";
}
#left,#top,#town,#console{min-width:0;min-height:0}
#left{grid-area:left} #top{grid-area:top}
#town{grid-area:town} #console{grid-area:console}

.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:0 1px 0 #ffffff08 inset, 0 8px 24px #0008;
}
.ph{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
/* Reference console header is 47px tall (995,47 504x47). */
#console .ph{height:47px;flex:0 0 47px}
.ph .tag{color:var(--cy)}
.pb{flex:1;min-height:0;position:relative}

/* ── upper centre ─────────────────────────────────────
   Reference: nodes at x=358 (18px into the 643 column) y=88 (41px down), 142 wide,
   cards 39 tall with 21px gaps. Orb panel x=653 (313 across), y=54 (7 down),
   299x286, leaving 31px clear on the right. Asymmetric on purpose - the orb is
   NOT centred, and the node cards must not stretch across the column. */
#top{position:relative;display:flex;align-items:flex-start;
  justify-content:space-between;padding:7px 31px 0 18px}
#nodes{display:flex;flex-direction:column;gap:21px;width:142px;flex:0 0 142px;margin-top:34px}
#nodes .node{height:39px;box-sizing:border-box}
.node{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  background:#0c141c;border:1px solid var(--nc,var(--line));
  box-shadow:0 0 14px -6px var(--nc);position:relative;
}
.node .ic{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;
  background:#0006;border:1px solid var(--nc);color:var(--nc);font-size:11px}
.node .lb{flex:1;letter-spacing:.14em;font-size:10.5px;color:var(--hi)}
.node .ct{font-variant-numeric:tabular-nums;color:var(--nc);font-weight:700;font-size:13px}
.node .pip{position:absolute;right:-3px;top:50%;width:6px;height:6px;margin-top:-3px;
  border-radius:50%;background:var(--nc);box-shadow:0 0 8px var(--nc)}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#orbwrap{
  width:299px;height:286px;flex:0 0 299px;border-radius:var(--r);position:relative;
  overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 120% at 50% 40%,#121b26 0%,#070c12 70%);
  box-shadow:0 8px 30px #0009, 0 1px 0 #ffffff08 inset;
}
#orb{position:absolute;inset:0}
#orbstate{
  position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:99px;background:#000a;border:1px solid var(--line);
  font-size:10px;letter-spacing:.16em;color:var(--dim)
}
#orbstate .dot{width:6px;height:6px}
#startbtn{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  padding:7px 30px;border-radius:6px;cursor:pointer;
  background:#0b1a22;border:1px solid var(--cy);color:var(--cy);
  font:600 10.5px/1 inherit;letter-spacing:.22em;
  box-shadow:0 0 18px -6px var(--cy);transition:.15s;
}
#startbtn:hover{background:#0e2632;box-shadow:0 0 22px -4px var(--cy)}
#startbtn.stop{border-color:var(--rd);color:var(--rd);box-shadow:0 0 18px -6px var(--rd)}

/* ── left rail ─────────────────────────────────────────── */
/* Reference: rail is 12,47 316x752 but the panels inside are 28,62 284x137 -
   i.e. inset 16px each side, 15px top, 13px bottom. The rail is NOT flush. */
#left{display:flex;flex-direction:column;gap:13px;min-height:0;
  padding:15px 16px 13px}
/* The globe is the flexible one: on a normal laptop window the left rail is
   ~640px and this gets ~380px, which is where its own HUD becomes readable.
   The mins are set so a SHORT window degrades instead of overflowing - three
   stacked panels need ~340px and the harness viewport is only 554px tall. */
#globePanel{flex:427 1 0;min-height:150px}
#hlPanel{flex:134 1 0;min-height:64px;max-height:none}

/* Enough vertical room: give the globe real space instead of a cramped strip. */
@media (min-height:820px){
  #globePanel{min-height:260px}
}
/* Very short windows: the headlines list is the least useful of the three, so it
   gives up its space first rather than pushing the others off-screen. */
@media (max-height:620px){
  #hlPanel{min-height:52px}
  #camPanel{min-height:70px}
  #globePanel{min-height:110px}
}
#headlines{overflow:auto;padding:4px 10px 8px;flex:1 1 auto}
#headlines .it{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #101923}
#globeTools button{
  width:26px;height:26px;border-radius:6px;cursor:pointer;
  background:#0b141ccc;border:1px solid var(--line);color:var(--ink);font-size:13px;
  backdrop-filter:blur(6px);
}
#globeTools button:hover{border-color:var(--cy);color:var(--cy)}
#mapModes{position:absolute;left:8px;top:44px;display:flex;gap:4px;z-index:3}
#mapModes button{
  padding:3px 9px;border-radius:5px;cursor:pointer;font-size:9.5px;letter-spacing:.12em;
  background:#0b141ccc;border:1px solid var(--line);color:var(--dim);backdrop-filter:blur(6px)
}
#mapModes button[aria-selected=true]{border-color:var(--cy);color:var(--cy)}
/* Fixed height, not flex-grown: .panel .pb carries flex:1;min-height:0, so a
   camera panel left to flex collapsed to its 33px header and showed nothing. */
/* Reference rail split, measured: camera 136/733 = 17%, globe 415/733 = 57%,
   headlines 165/733 = 23%. The globe was getting 11% of the rail, which is why
   its own HUD was unreadable - it was never given room. */
/* Reference rail heights 137 / 427 / 134 within a 752 rail (gaps eat 26px).
   flex-grow in the same ratio keeps those proportions at any viewport height,
   which percentages could not do once a min-height started binding. */
#camPanel{flex:137 1 0;min-height:76px}
#camPanel .pb{flex:1 1 auto;min-height:0;background:#05080c}
#camFeed{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
#camOff,#camErr{position:absolute;inset:0;display:grid;place-content:center;
  color:var(--dim);font-size:9.5px;letter-spacing:.16em;text-align:center;padding:8px}
/* An author `display` rule beats the UA stylesheet's [hidden]{display:none}, so
   the overlay stayed painted on top of the live feed. Re-assert it. */
#camOff[hidden],#camErr[hidden]{display:none}
#camErr{color:var(--rd);letter-spacing:0;font-size:10px}
#camPanel button{text-transform:uppercase}
#camPanel button.on{border-color:var(--rd);color:var(--rd)}
#globe{position:absolute;inset:0;border:0;width:100%;height:100%;background:#000}
#globeTools{
  position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;z-index:3
}
#headlines a{color:var(--ink);text-decoration:none;line-height:1.35}
#headlines a:hover{color:var(--cy)}
#headlines .src{color:var(--dim);font-size:10px}

/* ── agent town ────────────────────────────────────────── */
#townhead{display:flex;align-items:center;gap:6px;margin-left:auto}
.tab{
  padding:3px 10px;border-radius:5px;cursor:pointer;font-size:10px;letter-spacing:.1em;
  background:transparent;border:1px solid transparent;color:var(--dim)
}
.tab[aria-selected=true]{background:#13202c;border-color:var(--cy);color:var(--cy)}
#townbody{position:absolute;inset:0;overflow:hidden;background:#080d13;
  display:grid;place-items:center}
#townCanvas{image-rendering:pixelated;max-width:100%;max-height:100%;
  width:auto;height:auto}
#townNote{position:absolute;inset:0;display:grid;place-content:center;gap:6px;
  text-align:center;color:var(--dim);background:#080d13f2;padding:20px}
/* An author `display` rule beats the UA stylesheet's [hidden]{display:none}, so
   this overlay stayed painted ON TOP of the live town canvas even while hidden -
   which is why Agent Town measured mean luma 110 in the canvas but rendered at
   16.6 on screen: we were looking at the overlay's background, not the office.
   Same trap as #camOff, fixed here too. */
#townNote[hidden]{display:none}
#townNote b{color:var(--hi);font-size:12px;letter-spacing:.1em}
#townNote span{font-size:10px}

/* ── console (right): chat ─────────────────────────────────── */
#convo{display:flex;flex-direction:column}
#stream{flex:1 1 auto;min-height:0}
/* Reference console cards sit at x=1027 in a 504 column: 32px inset, 459 wide. */
.msg{margin:0 22px 12px;max-width:calc(100% - 45px)}
.msg .who{font-size:9px;letter-spacing:.14em;margin-bottom:3px}
.msg .bub{padding:7px 9px;border-radius:8px;white-space:pre-wrap;word-break:break-word;
  font:11px/1.5 inherit}
.msg.me{align-self:flex-end;text-align:right}
.msg.me .who{color:var(--cy)}
.msg.me .bub{background:#12303a;border:1px solid #1d4b5c;color:#d8f4ff}
.msg.ai .who{color:var(--gr)}
.msg.ai .bub{background:#101a14;border:1px solid #1d3a28;color:#d5e8dc}
.msg.sys .bub{background:#0d141c;border:1px solid var(--line);color:var(--dim);font-size:10px}
.msg .att{margin-top:5px;font-size:10px;color:var(--am);
  border-top:1px solid #3a2f16;padding-top:4px}
/* Reference input row: x=1010 w=474 h=47, pinned to the bottom of the panel. */
/* Reference input row 1010,738 474x47 with 14px of panel below it. */
#composer{flex:0 0 47px;display:flex;align-items:center;gap:10px;
  margin:0 15px 14px;border-top:1px solid var(--line);background:#080d13}
#chips{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto;max-width:40%}
#chips:empty{display:none}
.chip{font-size:10px;padding:3px 8px;border-radius:99px;background:#13202c;
  border:1px solid var(--cy);color:var(--cy);display:flex;gap:6px;align-items:center}
.chip .x{cursor:pointer;color:var(--dim)}
.crow{display:flex;gap:6px;align-items:center}
#typebox{flex:1;min-width:0;padding:8px 10px;border-radius:7px;background:#0b131b;
  border:1px solid var(--line);color:var(--ink);font:12px/1.3 inherit;outline:none}
#typebox:focus{border-color:var(--cy)}
#composer button{width:32px;height:32px;flex:0 0 32px;border-radius:7px;cursor:pointer;
  background:#0e1922;border:1px solid var(--line);color:var(--ink);font-size:14px}
#composer button:hover{border-color:var(--cy);color:var(--cy)}
#send{background:#0d2a33;border-color:var(--cy);color:var(--cy)}
#composer button:disabled{opacity:.4;cursor:not-allowed}

/* ── console (right) ───────────────────────────────────── */
#tabs{display:flex;gap:2px;margin-left:6px}
#stream{overflow:auto;padding:8px 10px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.ev{border-left:2px solid var(--line);padding:3px 0 3px 8px;margin-bottom:5px}
.ev .hd{display:flex;gap:7px;color:var(--dim);font-size:10px}
.ev .hd b{color:var(--ink);font-weight:600}
.ev .bd{color:var(--ink);word-break:break-word;white-space:pre-wrap}
.call{margin-bottom:9px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0a121a}
.call .ch{display:flex;align-items:center;gap:7px;padding:5px 8px;background:#0e1822;
  border-bottom:1px solid var(--line)}
.call .ch b{color:var(--cy);font-size:10.5px;font-weight:700}
.call .ch .pf{color:var(--gr);font-size:9.5px;background:#0d1f18;border:1px solid #1c3a2a;
  border-radius:99px;padding:1px 6px}
.call .ch .tm{margin-left:auto;color:var(--dim);font-size:9.5px}
.blk{padding:5px 8px}
.blk .lb{color:var(--am);font-size:9px;letter-spacing:.14em;margin-bottom:2px}
.blk.out .lb{color:var(--vi)}
.blk pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);
  font:10.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:150px;overflow:auto}
.blk.out pre{color:#9fb3c8}
.ev.ok{border-left-color:var(--gr)} .ev.bad{border-left-color:var(--rd)}
.ev.work{border-left-color:var(--am)} .ev.info{border-left-color:var(--cy)}

/* ── status bar ────────────────────────────────────────── */
#status{
  flex:0 0 30px;display:flex;align-items:center;gap:16px;padding:0 12px;
  border-top:1px solid var(--line);background:#070c12;color:var(--dim);font-size:10.5px
}
#status b{color:var(--ink);font-weight:600}
.meter{width:88px;height:5px;border-radius:99px;background:#131c26;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr))}
#chat{position:absolute;right:10px;bottom:40px;display:flex;gap:6px;z-index:4}
#chat button{
  padding:5px 12px;border-radius:6px;cursor:pointer;font-size:10px;letter-spacing:.14em;
  background:#0b141ccc;border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(6px)
}
#chat button:hover{border-color:var(--cy);color:var(--cy)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1b2836;border-radius:9px}
</style>
</head>
<body>

<div id="top">
  <span id="brand">HEL<b>I</b>X</span>
  <span class="ver">
    <span><span class="dot" id="vDot"></span> <span id="vTxt">connecting</span></span>
    <span id="vModel">—</span>
  </span>
</div>

<main>
  <!-- UPPER CENTRE: nodes (left) and orb (right) as separate panels -->
  <div id="top">
      <svg id="links"></svg>
      <div id="nodes">
        <div class="node" data-k="memory" style="--nc:var(--cy)"><span class="ic">◉</span><span class="lb">MEMORY</span><span class="ct" id="c-memory">–</span><span class="pip"></span></div>
        <div class="node" data-k="skills" style="--nc:var(--am)"><span class="ic">▦</span><span class="lb">SKILLS</span><span class="ct" id="c-skills">–</span><span class="pip"></span></div>
        <div class="node" data-k="soul"   style="--nc:var(--gr)"><span class="ic">▣</span><span class="lb">SOUL</span><span class="ct" id="c-soul">–</span><span class="pip"></span></div>
        <div class="node" data-k="settings" style="--nc:#7d8b99"><span class="ic">⚙</span><span class="lb">SETTING</span><span class="ct" id="c-settings">–</span><span class="pip"></span></div>
      </div>
      <div id="orbwrap">
        <div id="orb"></div>
        <div id="orbstate"><span class="dot" id="orbDot"></span><span id="orbTxt">IDLE</span>
          <span id="coreState"></span></div>
        <button id="startbtn">START HELIX</button>
      </div>
  </div>

  <!-- LEFT RAIL -->
  <div id="left">
    <section class="panel" id="camPanel">
      <div class="ph"><span class="tag">◉</span> Media Link
        <span id="camState" style="margin-left:auto;text-transform:none;letter-spacing:0">offline</span>
        <button id="camToggle" style="margin-left:8px;padding:2px 8px;border-radius:4px;cursor:pointer;
          background:#0b141c;border:1px solid var(--line);color:var(--dim);font-size:9px;letter-spacing:.12em">START</button>
      </div>
      <div class="pb">
        <img id="camFeed" alt="" hidden>
        <div id="camOff"><span>CAMERA OFF</span></div>
        <div id="camErr" hidden></div>
      </div>
    </section>
    <section class="panel" id="globePanel">
      <div class="ph"><span class="tag">◉</span> Sat-Link Feed <span style="margin-left:auto;text-transform:none;letter-spacing:0" id="globeSrc"></span></div>
      <div class="pb">
        <iframe id="globe" src="http://127.0.0.1:4173/?cb=2&welcome=0&clean=1" title="globe"></iframe>
        <div id="mapModes">
          <button data-m="3d" aria-selected="true">3D</button>
          <button data-m="2d" aria-selected="false">2D MAP</button>
        </div>
        <div id="globeTools">
          <button id="gZoom" title="zoom in">+</button>
          <button id="gOut" title="zoom out">−</button>
        </div>
      </div>
    </section>
    <section class="panel" id="hlPanel">
      <div class="ph"><span class="tag">◉</span> Today Headlines <span style="margin-left:auto" id="hlCount"></span></div>
      <div id="headlines"></div>
    </section>
  </div>

  <!-- AGENT TOWN -->
  <section class="panel" id="town">
    <div class="ph">
      <span class="tag">◉</span> Agent Town
      <div id="townhead">
        <button class="tab" data-t="agents" aria-selected="true">agents</button>
        <button class="tab" data-t="visual" aria-selected="false">visual hub</button>
        <button class="tab" data-t="gesture" aria-selected="false">gesture</button>
      </div>
    </div>
    <div class="pb">
      <div id="townbody"><canvas id="townCanvas"></canvas><div id="townNote" hidden><b></b><span></span></div></div>
      <div id="chat">
        <button id="chatBtn">CHAT</button>
      </div>
      <div id="status">
        <span><span class="dot" id="sDot"></span> <b id="sOnline">offline</b></span>
        <span>model <b id="sModel">—</b></span>
        <span>CTX <span class="meter"><i id="sCtx" style="width:0%"></i></span> <b id="sCtxN">0</b></span>
        <span><b id="sBusy">0</b>/<b id="sSeats">0</b> busy</span>
        <span style="margin-left:auto" id="sAgents">–</span>
      </div>
    </div>
  </section>

  <!-- CONSOLE -->
  <section class="panel" id="console">
    <div class="ph">
      <span class="tag">◉</span> Console
      <div id="tabs">
        <button class="tab" data-c="chat" aria-selected="true">CHAT</button>
        <button class="tab" data-c="agent" aria-selected="false">TOOLS <span id="actCount"></span></button>
        <button class="tab" data-c="notes" aria-selected="false">NOTES</button>
      </div>
    </div>
    <div class="pb" id="convo">
      <div id="stream"></div>
      <div id="toolsView" hidden></div>
      <div id="notesView" hidden><div class="msg sys"><div class="bub">
        Notes view is not built yet — shown honestly rather than as a mock.</div></div></div>
      <div id="composer">
        <div id="chips"></div>
        <div class="crow">
          <button id="attach" title="Send a file to Helix">&#128206;</button>
          <input id="typebox" type="text" placeholder="Type a command for Helix&hellip;" autocomplete="off">
          <button id="send" title="Send">&#10148;</button>
        </div>
        <input id="fileInput" type="file" hidden>
      </div>
    </div>
  </section>
</main>



<script type="module">
import { createOrbScene } from "./orbScene.js";
import { createTown } from "./town.js";

const $ = s => document.querySelector(s);
const log = (txt, cls="info") => {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  d.innerHTML = `<div class="hd"><b>${new Date().toTimeString().slice(0,8)}</b><span>${txt}</span></div>`;
  const s = $("#toolsView"); s.prepend(d);
  while (s.children.length > 120) s.lastChild.remove();
};

/* ── orb ───────────────────────────────────────────────── */
let orb = null;
try { orb = createOrbScene($("#orb")); log("orb ready","ok"); }
catch(e){ log("orb failed: "+e.message,"bad"); $("#orb").innerHTML =

/* node links, redrawn on resize like voice-core does */
const NODES = ["memory","skills","soul","settings"];
/* Positions are taken with getBoundingClientRect and rebased onto #top, NOT with
   offsetLeft/offsetTop. #top is now the positioned ancestor for the SVG, but the
   nodes and the orb sit inside nested flex boxes, so offsetLeft was measured
   from the wrong element and the connectors drew as two stubs floating to the
   right of the orb. */
function drawLinks(){
  const host = $("#top"), svg = $("#links");
  const hb = host.getBoundingClientRect();
  const w = Math.round(hb.width), h = Math.round(hb.height);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const ob = $("#orbwrap").getBoundingClientRect();
  const cx = Math.round(ob.left - hb.left + ob.width/2);
  const cy = Math.round(ob.top - hb.top + ob.height/2);
  const COL = {memory:"#22d3ee",skills:"#f59e0b",soul:"#22c55e",settings:"#7d8b99"};
  svg.innerHTML = NODES.map(k=>{
    const n = document.querySelector(`.node[data-k=${k}]`);
    const nb = n.getBoundingClientRect();
    const x = Math.round(nb.right - hb.left + 3);
    const y = Math.round(nb.top - hb.top + nb.height/2);
    const mx = x + (cx-x)*0.55;
    return `<path d="M${x},${y} L${mx},${y} L${cx},${cy}" fill="none"
      stroke="${COL[k]}" stroke-width="1.5" opacity=".75"/>
      <circle cx="${x}" cy="${y}" r="2.5" fill="${COL[k]}"/>`;
  }).join("");
}
addEventListener("resize",drawLinks);
setTimeout(drawLinks,60);

  }catch(e){ log("cortex: "+e.message,"bad"); }

/* ── state (live, real kanban) ─────────────────────────── */
let SEAT = 4;
async function state(){
  try{
    const r = await fetch("/state"), d = await r.json();
    const ps = d.profiles || [];
    SEAT = Math.min(SEAT || 4, 9);
    const busy = ps.filter(p=>p.status==="working").length;
    $("#sAgents").textContent = ps.length + " agents";
    $("#sBusy").textContent = busy;
    $("#sSeats").textContent = SEAT;
    // model + context: real numbers from the bridge, never a placeholder.
    if (d.model) $("#sModel").textContent = d.model.replace(":free", "");
    const ctx = d.ctx;
    if (typeof ctx === "number" && ctx > 0) {
      $("#sCtxN").textContent = ctx.toLocaleString();
      const pct = Math.min(100, ctx / (d.ctx_max || 200000) * 100);
      $("#sCtx").style.width = pct.toFixed(1) + "%";
    } else {
      $("#sCtxN").textContent = "n/a";   // unknown, never a fabricated 0
      $("#sCtx").style.width = "0%";
    }
    const anyW = busy > 0;
    $("#orbDot").className = "dot " + (anyW ? "warn" : "on");
    $("#orbTxt").textContent = anyW ? `${busy} WORKING` : "IDLE";
    $("#coreState").textContent = ps.length + " agents · " + busy + " working";
    drawDesks(ps);
  }catch(e){ $("#vDot").className="dot err"; $("#vTxt").textContent="bridge down"; }
}

/* ── live event stream ─────────────────────────────────── */
const seen = new Set();
function wireEvents(){
  const es = new EventSource("/events");
  es.onopen = ()=>{ $("#vDot").className="dot on"; $("#vTxt").textContent="live";
                     $("#sDot").className="dot on"; $("#sOnline").textContent="online"; };
  es.onerror = ()=>{ $("#vDot").className="dot warn"; $("#vTxt").textContent="reconnecting";
                     $("#sDot").className="dot warn"; $("#sOnline").textContent="reconnecting"; };
  es.onmessage = ev=>{
    let d; try{ d = JSON.parse(ev.data); }catch{ return; }
    const list = d.events || [];
    for (const e of list.slice(-6)){
      const id = e.id || JSON.stringify(e);
      if (seen.has(id)) continue; seen.add(id);
      const t = e.type || e.kind || "event";
      log(`${t} ${e.task||e.assignee||""}`.trim(),
          t==="completed"?"ok": t==="failed"?"bad": t==="claimed"||t==="spawned"?"work":"info");
    }
  };
}

/* ── MEDIA LINK: the real webcam, as an MJPEG <img> ─────────────────────
   Starts ONLY when the human presses START. The camera is not left running
   because a tab was once open: the panel calls /cam/stop when toggled off,
   and the bridge reaps ffmpeg when the client disconnects (measured: 0
   orphans after a client vanished mid-stream). */
let camOn = false;
function camStart(){
  const img = $("#camFeed");
  camOn = true;
  $("#camToggle").textContent = "STOP";
  $("#camToggle").classList.add("on");
  $("#camState").textContent = "connecting…";
  $("#camErr").hidden = true;
  $("#camOff").hidden = true;
  img.hidden = false;
  // Confirm by the frame actually arriving, not by the request having been made.
  // An <img> fed by multipart/x-mixed-replace fires load once the first frame
  // is decoded, so this is real evidence rather than a hopeful status line.
  img.onload = () => { $("#camState").textContent = "online"; };
  img.onerror = () => {
    $("#camState").textContent = "offline";
    $("#camErr").hidden = false;
    $("#camErr").textContent = "Camera unavailable — /dev/video0 could not be opened.";
    camStop();
  };
  img.src = "/cam?cb=" + Date.now();
}
function camStop(){
  const img = $("#camFeed");
  img.onload = null; img.onerror = null;
  img.removeAttribute("src");     // closes the socket -> bridge reaps ffmpeg
  img.hidden = true;
  $("#camOff").hidden = false;
  camOn = false;
  $("#camToggle").textContent = "START";
  $("#camToggle").classList.remove("on");
  $("#camState").textContent = "offline";
  fetch("/cam/stop").catch(()=>{});
}
$("#camToggle").onclick = () => camOn ? camStop() : camStart();

/* ── the chat box: typed commands and file uploads ─────────────────────
   Text goes through the SAME /say + /task path the voice loop uses, so this
   is reuse rather than a second conversation mechanism: POST /say creates a
   real Kanban task for the CEO, GET /task reads the worker's own summary back.
   Files go to /upload, which streams to ~/helix/inbox and hands the path to the
   document profile. */
const H = {"X-Helix-Voice": "1"};
let busyChat = false;

function addMsg(who, text, att){
  const d = document.createElement("div");
  d.className = "msg " + who;
  const label = {me:"YOU", ai:"HELIX", sys:"SYSTEM"}[who] || who;
  d.innerHTML = `<div class="who">${label}</div><div class="bub"></div>`;
  d.querySelector(".bub").textContent = text;
  if (att) {
    const a = document.createElement("div");
    a.className = "att";
    a.textContent = "\u{1F4CE} " + att;
    d.querySelector(".bub").appendChild(a);
  }
  $("#stream").appendChild(d);
  $("#stream").scrollTop = $("#stream").scrollHeight;
  return d;
}

async function ask(text){
  if (busyChat || !text.trim()) return;
  busyChat = true;
  $("#send").disabled = true; $("#typebox").disabled = true;
  addMsg("me", text);
  const pending = addMsg("ai", "\u2026 Helix is working on it\u2026");
  let res, id = null;
  try {
    res = await (await fetch("/say", {method:"POST", headers:{...H, "Content-Type":"application/json"},
                                   body: JSON.stringify({text})})).json();
    id = res.task;
  } catch(e) {
    pending.querySelector(".bub").textContent = "Could not reach Helix: " + e.message;
    busyChat = false; $("#send").disabled = false; $("#typebox").disabled = false;
    return;
  }
  if (!id) {
    pending.querySelector(".bub").textContent = (res && res.error) || "No task was created.";
    busyChat = false; $("#send").disabled = false; $("#typebox").disabled = false;
    return;
  }
  // poll for the worker's own summary, then give up LOUDLY rather than spinning
  const deadline = Date.now() + 240000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 2000));
    let t;
    try { t = await (await fetch("/task?id=" + encodeURIComponent(id))).json(); } catch(e) { continue; }
    if (t.status === "done"){ pending.querySelector(".bub").textContent = t.summary || "(no summary)"; break; }
    if (t.status === "failed" || t.status === "archived"){
      pending.querySelector(".bub").textContent = "Helix could not do this: " + (t.summary || t.status); break; }
  }
  if (Date.now() >= deadline) pending.querySelector(".bub").textContent =
    "Still running after 4 minutes — it has not failed, I just stopped waiting. Task " + id;
  busyChat = false;
  $("#send").disabled = false; $("#typebox").disabled = false;
}

async function upload(file){
  const fd = new FormData();
  fd.append("text", $("#typebox").value || "");
  fd.append("file", file, file.name);
  const mb = (file.size/1048576).toFixed(2);
  const hold = addMsg("sys", `Uploading ${file.name} (${mb} MB)…`);
  try {
    const r = await (await fetch("/upload", {method:"POST", headers:H, body:fd})).json();
    if (!r.ok){ hold.querySelector(".bub").textContent = "Upload failed: " + r.error; return; }
    hold.querySelector(".bub").textContent = "Sent to Helix.";
    addMsg("me", "Sent you a file.", `${r.name} · ${mb} MB`);
    $("#typebox").value = "";
    if (r.task){
      const pending = addMsg("ai", "\u2026 Helix is reading it\u2026");
      const deadline = Date.now() + 300000;
      while (Date.now() < deadline) {
        await new Promise(r2 => setTimeout(r2, 2500));
        let t;
        try { t = await (await fetch("/task?id=" + encodeURIComponent(r.task))).json(); } catch(e) { continue; }
        if (t.status === "done"){ pending.querySelector(".bub").textContent = t.summary || "(done, no summary)"; break; }
        if (t.status === "failed" || t.status === "archived"){
          pending.querySelector(".bub").textContent = "Could not process it: " + (t.summary || t.status); break; }
      }
      if (Date.now() >= deadline) pending.querySelector(".bub").textContent =
        "Still working on it. Task " + r.task;
    }
  } catch(e){ hold.querySelector(".bub").textContent = "Upload failed: " + e.message; }
}

$("#send").onclick = () => { const v = $("#typebox").value; $("#typebox").value = ""; ask(v); };
$("#typebox").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#send").click(); } });
$("#attach").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => { const f = e.target.files[0]; if (f) upload(f); e.target.value = ""; };
// paste an image straight into the box
$("#typebox").addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items||[])].find(i => i.type.startsWith("image/"));
  if (it){ e.preventDefault(); upload(it.getAsFile()); } });

/* ── real tool calls, from state.db via /activity ────────────────────── */
let actMode = "voice";
const esc = s => String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hhmm = ts => { try { return new Date(ts*1000).toTimeString().slice(0,8); } catch { return ""; } };

let _actTimer = 0;
function startActivityPoll(){
  clearInterval(_actTimer);
  // The panel used to render once and then never update, so live agent work was
  // invisible until you re-selected the tab.
  _actTimer = setInterval(() => { if (actMode === "agent") activity(); }, 6000);
}

async function activity(){
  const el = $("#toolsView");
  el.innerHTML = '<div class="ev info"><div class="bd">loading real tool calls…</div></div>';
  let d;
  try { d = await (await fetch("/activity")).json(); }
  catch(e){ el.innerHTML = `<div class="ev bad"><div class="bd">activity: ${esc(e.message)}</div></div>`; return; }
  const calls = d.calls || [];
  if (!calls.length){ el.innerHTML = '<div class="ev info"><div class="bd">No tool calls recorded yet.</div></div>'; return; }
  el.innerHTML = calls.map(c => `
    <div class="call">
      <div class="ch"><b>${esc(c.tool)}</b><span class="pf">${esc(c.profile)}</span>
        <span class="tm">${hhmm(c.ts)}</span></div>
      <div class="blk"><div class="lb">INPUT</div><pre>${esc(c.args)||"{}"}</pre></div>
      <div class="blk out"><div class="lb">OUTPUT</div><pre>${esc(c.result)||"(empty)"}</pre></div>
    </div>`).join("");
  $("#actCount").textContent = calls.length + " calls";
}

/* ── headlines ─────────────────────────────────────────── */
async function headlines(){
  try{
    const r = await fetch("/headlines"), d = await r.json();
    // Real shape is {ts, feeds:[{source, error, items:[{title,link,date}]}], total}
    // - items are nested per feed, there is no top-level items array. My first
    // parser looked for d.items and rendered 0 stories against a 200 response.
    const items = (d.feeds||[]).flatMap(f => (f.items||[]).map(s => Object.assign({}, s, {source: f.source})));
    $("#hlCount").textContent = items.length + " stories";
    $("#headlines").innerHTML = items.slice(0,16).map((s,i)=>
      `<div class="it"><span class="n">${String(i+1).padStart(2,"0")}</span>
        <div><a href="${s.link}" target="_blank" rel="noopener">${s.title}</a>
        <div class="src">${s.source||""}</div></div></div>`).join("");
  }catch(e){ log("headlines: "+e.message,"bad"); }
}

document.querySelectorAll("#townhead .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#townhead .tab").forEach(x=>x.setAttribute("aria-selected", x===b));
  const note = $("#townNote");
  if (b.dataset.t!=="agents"){
    if (town) town.stop();
    log(`${b.dataset.t}: not built yet — honest, not faked`,"info");
    note.querySelector("b").textContent = b.dataset.t;
    note.querySelector("span").textContent =
      "Not implemented yet. Showing an honest placeholder rather than a mock pretending to be live data.";
    note.hidden = false;
  } else {
    note.hidden = true;
    if (town) town.start();
    state();
  }
});
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs .tab").forEach(x=>x.setAttribute("aria-selected", x===b));
  actMode = b.dataset.c;
  const which = { chat:"#stream", agent:"#toolsView", notes:"#notesView" }[b.dataset.c];
  ["#stream","#toolsView","#notesView"].forEach(id =>
    document.querySelector(id).hidden = (id !== which));
  $("#composer").hidden = b.dataset.c !== "chat";
  if (b.dataset.c === "agent"){ activity(); startActivityPoll(); }
  else clearInterval(_actTimer);
});
$("#chatBtn").onclick = ()=> log("text chat not built yet — voice/whatsapp are the live channels","info");

/* start/stop is honest: it reports what it actually does */
$("#startbtn").onclick = ()=>{
  const on = $("#startbtn").classList.toggle("stop");
  $("#startbtn").textContent = on ? "STOP HELIX" : "START HELIX";
  $("#orbTxt").textContent = on ? "LISTENING" : "IDLE";
  log(on ? "session requested — voice core runs at /voice-core/" : "session released","info");
};

cortex(); state(); headlines(); wireEvents();
setInterval(state, 4000);
setInterval(cortex, 15000);
setInterval(headlines, 300000);
log("console booted","ok");
