<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELIX</title>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#060910; --panel:#0a1017; --panel2:#0c141d; --line:#16222e; --line2:#223346;
  --ink:#c9d6e2; --dim:#5c6b7a; --hi:#e8f2fb;
  --cy:#22d3ee; --am:#f59e0b; --gr:#22c55e; --rd:#ef4444; --vi:#a78bfa;
  /* the reference chamfers every panel corner; this is the cut size */
  --bevel:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),
                  calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── title bar (reference 1509x47) ─────────────────────────────── */
/* Reference measures the topbar at exactly 35px, not 47. It is the single
   biggest vertical error in the previous layout: 12px of it was stolen from
   the workspace on every launch. */
#titlebar{
  height:35px;flex:0 0 35px;display:flex;align-items:center;gap:10px;
  padding:0 15px;background:#070c12;border-bottom:1px solid var(--line);
}
#brand{
  display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.18em;
  color:var(--hi);font-size:13px;padding-right:14px;
  border-right:1px solid var(--line);height:22px;
}
#brand .mark{
  width:16px;height:16px;border-radius:3px;flex:0 0 16px;
  background:conic-gradient(from 210deg,var(--cy),#6366f1,var(--vi),var(--cy));
  box-shadow:0 0 12px -2px var(--cy);
}
.tbtn{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:5px;cursor:pointer;
  background:#0b141c;border:1px solid var(--line);color:var(--ink);font:10px/1 inherit;
  letter-spacing:.12em;transition:.15s;
}
.tbtn:hover{border-color:var(--cy);color:var(--cy)}
.tbtn .gl{color:var(--dim)}
#tbRight{margin-left:auto;display:flex;align-items:center;gap:14px}
#tbRight .ver{color:var(--dim);font-size:11px;letter-spacing:.08em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;flex:0 0 7px}
.dot.on{background:var(--gr);box-shadow:0 0 8px var(--gr)}
.dot.warn{background:var(--am)}.dot.err{background:var(--rd)}

/* ── workspace grid ───────────────────────────────────────────────
   Reference 1509x812: left 12,47 316x752 | centre 340,47 643x752 |
   right 995,47 504x752. fr units, not %, because % resolves against the
   content box and overflows by the gap width. */
/* Reference, measured at 1509x812:
     topbar 35 | 12px pad | columns 752 | statusbar 13  =  812
   The columns run flush into the statusbar, so there is NO bottom padding.
   Row gap inside a column is 10px; the gap BETWEEN columns is 12px. Using one
   `gap` value for both is why every panel came out short.
     centre column rows: core 312, town 430, +10 gap = 752               */
/* Row gap is 20px here, not 10px. Rows are sized in `fr`, and fr divides the
   space that is LEFT after the gap - so with a 10px gap the rows had to sum to
   742 to hit the audited 312/430. Shortening the town by 10 meant the rows
   summed to 732 and fr handed the leftover 10px back proportionally, which
   grew the CORE from 312 to 316 and moved the town to y=373 instead of 379.
   A 20px row gap makes 312+420 sum to 732 against 752-20, so the core stays
   exactly 312 and the town starts 10px lower. */
main{
  flex:1;min-height:0;display:grid;column-gap:12px;row-gap:20px;padding:12px 12px 0;
  grid-template-columns:minmax(0,316fr) minmax(0,642fr) minmax(0,503fr);
  grid-template-rows:minmax(0,312fr) minmax(0,420fr);
  grid-template-areas:"left core console" "left town console";
}
#left,#core,#town,#console{min-width:0;min-height:0}
#left{grid-area:left} #core{grid-area:core}
#town{grid-area:town} #console{grid-area:console}

/* ── bevelled panel ──────────────────────────────────────────────
   clip-path cuts the corner, but it also cuts the border with it, so the
   visible outline is a ::before ring inset by -1px behind the fill. */
.panel{
  position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:0 10px 30px #0009, 0 1px 0 #ffffff07 inset;
}
.panel::before{
  content:"";position:absolute;inset:-1px;z-index:-1;
  clip-path:var(--bevel);background:var(--line);pointer-events:none;
}
.ph{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:6px 12px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:#070c12aa;
}
/* Reference console rows: 42px header / 660px body / 48px composer. */
#console .ph{height:42px;flex:0 0 42px}
.ph .tag{color:var(--cy)}
.ph .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.icobtn{
  width:24px;height:24px;border-radius:5px;cursor:pointer;display:grid;place-items:center;
  background:#0b141ccc;border:1px solid var(--line);color:var(--dim);font-size:12px;
}
.icobtn:hover{border-color:var(--cy);color:var(--cy)}
.pb{flex:1;min-height:0;position:relative}

/* ── centre: node pills + connectors + core ─────────────────────── */
/* Reference core panel: padding 6px 10px 7px, columns 155px / 465.125px.
   Mine inset the orb 31px from the right and 18px from the left, which pushed
   it off the reference position entirely. */
/* Reference: the orb is CENTRED in the 465px second column, not left-aligned in
   a 299px box. Content box is 350..972 with the column starting at 505, so its
   centre is x=737.6 - which is where the reference START button sits (738.5).
   The orb canvas stays 299x286; only its placement changes. */
#core{
  position:relative;display:grid;grid-template-columns:155px minmax(0,1fr);
  align-items:start;justify-items:center;padding:6px 10px 7px;
  /* The orb is a fixed 299x286 box but this row is only 312px at the reference
     size, so there was 7px of slack. On any shorter window the orb spilled out
     of the row and landed on the Agent Town tab strip below - measured, not
     guessed: core 312 vs orb needing 13+286 = 299, so anything under ~781px of
     window height overlapped. Clipping here makes that impossible at any size. */
  overflow:hidden;
}
#nodes{display:flex;flex-direction:column;gap:21px;width:155px;flex:0 0 155px}
.node{
  --nc:var(--cy);
  display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 9px;
  background:linear-gradient(90deg,#0f1b26,#0b131b);
  border-left:2px solid var(--nc);
  box-shadow:0 0 16px -8px var(--nc);
  /* angled left cap and a notched right edge, matching the reference pill */
  clip-path:polygon(0 0,100% 0,100% 78%,calc(100% - 11px) 100%,0 100%);
}
.node .ic{
  width:21px;height:21px;flex:0 0 21px;display:grid;place-items:center;border-radius:5px;
  background:#0007;border:1px solid var(--nc);color:var(--nc);font-size:11px;
}
.node .lb{flex:1;letter-spacing:.16em;font-size:10px;color:var(--hi)}
.node .ct{font-variant-numeric:tabular-nums;color:var(--nc);font-weight:700;font-size:13px}
.node .pip{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--nc);
  box-shadow:0 0 8px var(--nc)}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
/* Nudged up and right at the user's request. Right: the 465px column leaves 84px
   of slack past the orb. Positioned at translateX(36px) / margin-top 0: the
   user asked for a further 10px right and 2px up from where it sat. */
#orbwrap{
  width:299px;height:286px;flex:0 0 299px;position:relative;overflow:hidden;
  margin-top:0;transform:translateX(36px);
  clip-path:var(--bevel);
  background:radial-gradient(120% 120% at 50% 38%,#0e1a26 0%,#060b11 72%);
  box-shadow:0 10px 34px #000a;
  z-index:1;
}
#orbwrap::before{
  content:"";position:absolute;inset:-1px;z-index:-1;
  clip-path:var(--bevel);background:var(--line);pointer-events:none;
}
#orb{position:absolute;inset:0}
#orbstate{
  position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:6px;
  padding:3px 10px;background:#0009;border:1px solid var(--line);border-radius:99px;
  font-size:9.5px;letter-spacing:.18em;color:var(--ink);z-index:2;
}
#orbstate .dot{width:6px;height:6px;flex:0 0 6px}
#coreState{color:var(--dim);letter-spacing:.1em}
/* Reference start button measures 145 x 32. Mine was 150 x 50. */
#startbtn{
  position:absolute;left:50%;transform:translateX(-50%);z-index:2;
  width:145px;height:32px;padding:0;bottom:10px;cursor:pointer;background:#08151c;color:var(--cy);
  border:1px solid var(--cy);font:600 10.5px/1 inherit;letter-spacing:.26em;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  box-shadow:0 0 20px -6px var(--cy);transition:.15s;
}
#startbtn:hover{background:#0d2530;box-shadow:0 0 26px -4px var(--cy)}
#startbtn.stop{border-color:var(--rd);color:var(--rd);box-shadow:0 0 20px -6px var(--rd)}

/* ── left rail ──────────────────────────────────────────────────── */
/* Reference left column: 134.969 / 415.328 / 181.703 with a 10px gap.
   Headlines was 131px against a target of 182 - the shortest panel was the one
   losing the most, which is why the rail read top-heavy. */
#left{display:grid;grid-template-rows:135fr 415fr 182fr;gap:10px;min-height:0}
#camPanel .pb{background:#05080c}
#camFeed{width:100%;height:100%;object-fit:cover;display:block}
#camOff,#camErr{position:absolute;inset:0;display:grid;place-content:center;
  color:var(--dim);font-size:9.5px;letter-spacing:.16em;text-align:center;padding:8px}
/* An author `display` rule beats the UA stylesheet's [hidden]{display:none}, so
   the overlay stays painted on top of the live feed. Re-assert it. */
#camOff[hidden],#camErr[hidden]{display:none}
#camErr{color:var(--rd);letter-spacing:0;font-size:10px}
#camPanel button{text-transform:uppercase}
#camPanel button.on{border-color:var(--rd);color:var(--rd)}
.mini{margin-left:6px;padding:2px 8px;border-radius:4px;cursor:pointer;
  background:#0b141c;border:1px solid var(--line);color:var(--dim);font-size:9px;letter-spacing:.12em}
.mini.live{border-color:var(--gr);color:var(--gr)}
.mini.arm{border-color:var(--am);color:var(--am)}
#gestStatus{position:absolute;left:10px;bottom:6px;font-size:9px;letter-spacing:.1em;
  color:var(--dim);pointer-events:none;text-shadow:0 0 4px #000}
#globe{position:absolute;inset:0;border:0;width:100%;height:100%;background:#04070c}
#globeTools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px;z-index:3}
#globeTools button{
  width:26px;height:26px;border-radius:6px;cursor:pointer;
  background:#0b141ccc;border:1px solid var(--line);color:var(--ink);font-size:13px;
  backdrop-filter:blur(6px);
}
#globeTools button:hover{border-color:var(--cy);color:var(--cy)}
#mapModes{position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:3}
#mapModes button{
  padding:3px 9px;border-radius:5px;cursor:pointer;font-size:9.5px;letter-spacing:.12em;
  background:#0b141ccc;border:1px solid var(--line);color:var(--dim);backdrop-filter:blur(6px)
}
#mapModes button[aria-selected=true]{border-color:var(--cy);color:var(--cy)}
#betaTag{
  position:absolute;right:10px;top:10px;z-index:3;padding:2px 7px;border-radius:4px;
  background:#0b141ccc;border:1px solid var(--cy);color:var(--cy);
  font-size:9px;letter-spacing:.14em;backdrop-filter:blur(6px)
}
#headlines{overflow:auto;padding:4px 12px 8px;flex:1 1 auto}
#headlines .it{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #101923}
#headlines .n{color:var(--cy);font-size:10px;font-weight:700;flex:0 0 auto;
  font-variant-numeric:tabular-nums;padding-top:1px}
#headlines a{color:var(--ink);text-decoration:none;line-height:1.35}
#headlines a:hover{color:var(--cy)}
#headlines .src{color:var(--dim);font-size:9.5px;margin-top:2px}

/* ── agent town ─────────────────────────────────────────────────── */
/* Reference town panel rows: 37px header / 358px scene / 26px footer. */
#town .ph{height:37px;flex:0 0 37px}
#townhead{display:flex;align-items:center;gap:4px;margin-left:auto}
.tab{
  padding:4px 12px;border-radius:5px;cursor:pointer;font-size:10px;letter-spacing:.1em;
  background:transparent;border:1px solid transparent;color:var(--dim);transition:.15s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:#13202c;border-color:var(--cy);color:var(--cy)}
/* Agent Town: 10px taken off the top (row 430 -> 420, so it starts at y=379 and
   still ends flush at the statusbar) and shifted 5px further right. The negative
   right margin widens it by that same 5px rather than just translating it. */
/* width = cell - margin-left - margin-right = 642 - 5 + 10 = 647 */
#town{margin-left:5px;margin-right:-10px}
#townbody{position:absolute;inset:0;overflow:hidden;background:#070c13;display:grid;place-items:center}
#townCanvas{image-rendering:pixelated;max-width:100%;max-height:100%;width:auto;height:auto}
#townNote{position:absolute;inset:0;display:grid;place-content:center;gap:6px;
  text-align:center;color:var(--dim);background:#070c13f2;padding:20px}
#townNote[hidden]{display:none}
#townNote b{color:var(--hi);font-size:12px;letter-spacing:.1em}
#townNote span{font-size:10px}
#chat{position:absolute;right:14px;bottom:48px;display:flex;gap:6px;z-index:4}
#chat button{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:5px;cursor:pointer;
  font-size:10px;letter-spacing:.14em;background:#0b141ccc;border:1px solid var(--line);
  color:var(--ink);backdrop-filter:blur(6px);
}
#chat button:hover{border-color:var(--cy);color:var(--cy)}

/* ── global status bar (own row, like the reference) ────────────── */
/* Reference statusbar is 13px - a full-width strip flush under the columns.
   Mine was 34px, which is 21px taken straight out of the workspace. The avatar
   had to shrink to fit: at 22px it alone was taller than the whole strip. */
/* 13px minus the 1px border is 12px of content, so line-height has to be
   pinned or the text is clipped at the bottom edge - it overflowed because the
   default line-height was taller than the strip itself. */
#status{
  flex:0 0 13px;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--line);background:#070c12;color:var(--dim);
  font-size:9px;line-height:12px;overflow:hidden;white-space:nowrap;
}
#status b{line-height:12px}
#status b{color:var(--ink);font-weight:600}
.meter{width:64px;height:4px;border-radius:99px;background:#131c26;overflow:hidden;display:inline-block;
  vertical-align:middle}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr))}
.avatar{
  width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:grid;place-items:center;
  background:#0c1c26;border:1px solid var(--cy);
  color:var(--cy);font-size:5px;font-weight:700;line-height:1;
}

/* ── console (right) ────────────────────────────────────────────── */
#tabs{display:flex;gap:4px;margin-left:8px}
#stream,#toolsView,#notesView{overflow:auto;padding:10px 14px;flex:1 1 auto;min-height:0}
#stream[hidden],#toolsView[hidden],#notesView[hidden]{display:none}
#convo{display:flex;flex-direction:column}
.msg{margin:0 0 12px}
.msg .who{font-size:9px;letter-spacing:.14em;margin-bottom:3px;color:var(--dim)}
.msg .bub{padding:8px 10px;border-radius:7px;white-space:pre-wrap;word-break:break-word;
  font:11px/1.5 inherit;background:#0d141c;border:1px solid var(--line);color:var(--ink)}
.msg.me .who{color:var(--cy)}
.msg.me .bub{background:#0f2a34;border-color:#1d4b5c;color:#d8f4ff}
.msg.ai .who{color:var(--gr)}
.msg.ai .bub{background:#0f1a15;border-color:#1d3a28;color:#d5e8dc}
.msg.sys .bub{color:var(--dim);font-size:10px}
.msg .att{margin-top:5px;font-size:10px;color:var(--am);
  border-top:1px solid #3a2f16;padding-top:4px}
.ev{border-left:2px solid var(--line);padding:3px 0 3px 8px;margin-bottom:5px}
.ev .hd{display:flex;gap:7px;color:var(--dim);font-size:10px}
.ev .hd b{color:var(--ink);font-weight:600}
.ev.ok{border-left-color:var(--gr)} .ev.bad{border-left-color:var(--rd)}
.ev.work{border-left-color:var(--am)} .ev.info{border-left-color:var(--cy)}
.call{margin-bottom:10px;background:#080f16;overflow:hidden;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.call .ch{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1822;
  border-bottom:1px solid var(--line)}
.call .ch b{color:var(--cy);font-size:11px;font-weight:700;letter-spacing:.06em}
.call .ch .pf{color:var(--gr);font-size:9.5px;background:#0d1f18;border:1px solid #1c3a2a;
  border-radius:99px;padding:1px 7px}
.call .ch .tm{margin-left:auto;color:var(--dim);font-size:9.5px}
.blk{padding:6px 10px}
.blk .lb{color:var(--am);font-size:9px;letter-spacing:.16em;margin-bottom:3px}
.blk.out .lb{color:var(--vi)}
.blk pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);
  font:10.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:170px;overflow:auto}
.blk.out pre{color:#9fb3c8}
#notesView .msg{max-width:100%}

/* command bar, full width at the bottom like the reference */
/* Left inset reduced 12px -> 2px at the user's request (10px). Right stays 12px
   so the send button keeps its margin from the panel edge. */
#composer{
  flex:0 0 48px;display:flex;align-items:center;gap:10px;margin:0 12px 0 2px;
  padding:0 6px 0 12px;border:1px solid var(--line);border-radius:9px;background:#0b131b;
}
#composer:focus-within{border-color:#2b4256}
#chips{display:flex;gap:5px;flex-wrap:nowrap;flex:0 0 auto;max-width:34%}
#chips:empty{display:none}
.chip{font-size:10px;padding:3px 8px;border-radius:99px;background:#13202c;
  border:1px solid var(--cy);color:var(--cy);display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .x{cursor:pointer;color:var(--dim)}
.crow{display:flex;gap:6px;align-items:center;margin-left:auto}
#typebox{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);
  font:12px/1.3 inherit;padding:10px 0}
#typebox::placeholder{color:#4a5967}
#composer button{width:34px;height:34px;flex:0 0 34px;border-radius:8px;cursor:pointer;
  background:#0e1922;border:1px solid var(--line);color:var(--ink);font-size:14px}
#composer button:hover{border-color:var(--cy);color:var(--cy)}
#send{background:#0d2a33;border-color:var(--cy);color:var(--cy)}
#composer button:disabled{opacity:.4;cursor:not-allowed}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1b2836;border-radius:9px}

/* ── short windows: give up the least useful space first ────────── */
@media (max-height:700px){
  #hlPanel{min-height:52px}
  #camPanel{min-height:70px}
  #globePanel{min-height:110px}
}
</style>
</head>
<body>

<div id="titlebar">
  <span id="brand"><span class="mark"></span>HEL<b>I</b>X</span>
  <button class="tbtn" id="demoBtn"><span class="gl">&#9654;</span> Demo Video</button>
  <button class="tbtn" id="fbBtn"><span class="gl">&#9993;</span> Feedback</button>
  <span id="tbRight">
    <span class="ver"><span class="dot" id="vDot"></span> <span id="vTxt">connecting</span></span>
    <span class="ver" id="vModel">—</span>
    <span class="ver">v1.0.0</span>
  </span>
</div>

<main>
  <!-- UPPER CENTRE: node pills on the left, animated connectors, core on the right -->
  <div id="core">
      <svg id="links"></svg>
      <div id="nodes">
        <div class="node" data-k="memory" style="--nc:var(--cy)"><span class="ic">◉</span><span class="lb">MEMORY</span><span class="ct" id="c-memory">–</span><span class="pip"></span></div>
        <div class="node" data-k="skills" style="--nc:var(--am)"><span class="ic">▦</span><span class="lb">SKILLS</span><span class="ct" id="c-skills">–</span><span class="pip"></span></div>
        <div class="node" data-k="soul"   style="--nc:var(--gr)"><span class="ic">▣</span><span class="lb">SOUL</span><span class="ct" id="c-soul">–</span><span class="pip"></span></div>
        <div class="node" data-k="settings" style="--nc:#7d8b99"><span class="ic">⚙</span><span class="lb">SETTING</span><span class="ct" id="c-settings">–</span><span class="pip"></span></div>
      </div>
      <div id="orbwrap">
        <div id="orb"></div>
        <div id="orbstate"><span class="dot" id="orbDot"></span><span id="orbTxt">IDLE</span>
          <span id="coreState"></span></div>
        <button id="startbtn">START AI</button>
      </div>
  </div>

  <!-- LEFT RAIL -->
  <div id="left">
    <section class="panel" id="camPanel">
      <div class="ph"><span class="tag">◉</span> Media Link
        <span class="tools">

<script type="module">
import { createOrbScene } from "./orbScene.js";
import { createTown } from "./town.js";

const $ = s => document.querySelector(s);
const log = (txt, cls="info") => {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  d.innerHTML = `<div class="hd"><b>${new Date().toTimeString().slice(0,8)}</b><span>${txt}</span></div>`;
  const s = $("#toolsView"); s.prepend(d);
  while (s.children.length > 120) s.lastChild.remove();
};

/* ── orb ───────────────────────────────────────────────── */
let orb = null;
try { orb = createOrbScene($("#orb")); log("orb ready","ok");
  // Module scope, so `orb` is invisible to the page: a test or a console poke
  // resolves `orb` to the <div id="orb"> element instead and gets undefined
  // methods. Publishing it keeps gesture control measurable.
  window.helixOrb = orb; }
catch(e){ log("orb failed: "+e.message,"bad"); $("#orb").innerHTML =
  `<div style="padding:20px;color:var(--rd)">Three.js could not start: ${e.message}</div>`; }

/* node links, redrawn on resize like voice-core does */
const NODES = ["memory","skills","soul","settings"];
/* Positions are taken with getBoundingClientRect and rebased onto #top, NOT with
   offsetLeft/offsetTop. #top is now the positioned ancestor for the SVG, but the
   nodes and the orb sit inside nested flex boxes, so offsetLeft was measured
   from the wrong element and the connectors drew as two stubs floating to the
   right of the orb. */
function drawLinks(){
  const host = $("#core"), svg = $("#links");
  const hb = host.getBoundingClientRect();
  const w = Math.round(hb.width), h = Math.round(hb.height);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const ob = $("#orbwrap").getBoundingClientRect();
  const cx = Math.round(ob.left - hb.left + ob.width/2);
  const cy = Math.round(ob.top - hb.top + ob.height/2);
  const COL = {memory:"#22d3ee",skills:"#f59e0b",soul:"#22c55e",settings:"#7d8b99"};
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  const pulses = [];
  NODES.forEach((k,i)=>{
    const n = document.querySelector(`.node[data-k=${k}]`);
    const nb = n.getBoundingClientRect();
    const x = Math.round(nb.right - hb.left + 4);
    const y = Math.round(nb.top - hb.top + nb.height/2);
    // Elbow then diagonal, like the reference: a short horizontal run off the
    // pill, then a straight segment converging on the core.
    const elbow = Math.min(x + 46, (x+cx)/2);
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", `M${x},${y} L${elbow},${y} L${cx},${cy}`);
    p.setAttribute("fill","none");
    p.setAttribute("stroke",COL[k]);
    p.setAttribute("stroke-width","1.5");
    p.setAttribute("opacity",".8");
    g.appendChild(p);
    const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("r","2.6"); dot.setAttribute("fill",COL[k]);
    dot.setAttribute("cx",x); dot.setAttribute("cy",y);
    g.appendChild(dot);
    // one travelling energy dot per link, staggered so they do not march in step
    const m = document.createElementNS("http://www.w3.org/2000/svg","circle");
    m.setAttribute("r","2.4"); m.setAttribute("fill",COL[k]);
    g.appendChild(m);
    pulses.push({ el:m, path:p, phase:i * 0.25 });
  });
  svg.innerHTML = "";
  svg.appendChild(g);
  pulseState.paths = pulses;
  pulseState.len = pulses.map(p => p.path.getTotalLength());
}
/* Energy dots ride the connector paths. Stops the rAF when the tab is hidden so
   a backgrounded console is not burning frames for an animation nobody sees. */
const pulseState = { paths:[], len:[], on:false, raf:0 };
function tickPulses(){
  const t = performance.now() / 1000;
  pulseState.paths.forEach((p,i)=>{
    const L = pulseState.len[i] || 1;
    const u = (t * 0.32 + p.phase) % 1;
    const pt = p.path.getPointAtLength(u * L);
    p.el.setAttribute("cx", pt.x); p.el.setAttribute("cy", pt.y);
    p.el.setAttribute("opacity", (0.25 + 0.75 * Math.sin(u * Math.PI)).toFixed(3));
  });
  pulseState.raf = requestAnimationFrame(tickPulses);
}
function startPulses(){
  if (pulseState.on) return;
  pulseState.on = true;
  tickPulses();
}
function stopPulses(){
  pulseState.on = false;
  cancelAnimationFrame(pulseState.raf);
}
document.addEventListener("visibilitychange", () =>
  document.hidden ? stopPulses() : startPulses());
addEventListener("resize",drawLinks);
setTimeout(drawLinks,60);
startPulses();

/* The orb scene is kept exactly as it was in the previous UI, so there is no
   setState() to drive - only the badge text changes, which comes from real
   /state data. sessionOn is the human's START AI toggle. */
let sessionOn = false;

/* ── cortex counts ─────────────────────────────────────── */
async function cortex(){
  try{
    const r = await fetch("/cortex"), d = await r.json();
    for (const k of NODES) $("#c-"+k).textContent = d[k] ?? 0;
  }catch(e){ log("cortex: "+e.message,"bad"); }
}

/* ── state (live, real kanban) ─────────────────────────── */
let SEAT = 4;
async function state(){
  try{
    const r = await fetch("/state"), d = await r.json();
    const ps = d.profiles || [];
    SEAT = Math.min(SEAT || 4, 9);
    const busy = ps.filter(p=>p.status==="working").length;
    $("#sAgents").textContent = ps.length + " agents";
    $("#sBusy").textContent = busy;
    $("#sSeats").textContent = SEAT;
    // model + context: real numbers from the bridge, never a placeholder.
    if (d.model) $("#sModel").textContent = d.model.replace(":free", "");
    const ctx = d.ctx;
    if (typeof ctx === "number" && ctx > 0) {
      $("#sCtxN").textContent = ctx.toLocaleString();
      const pct = Math.min(100, ctx / (d.ctx_max || 200000) * 100);
      $("#sCtx").style.width = pct.toFixed(1) + "%";
    } else {
      $("#sCtxN").textContent = "n/a";   // unknown, never a fabricated 0
      $("#sCtx").style.width = "0%";
    }
    // Orb state follows what the backend is actually doing:
    //   session off + nothing running -> idle
    //   session on, nothing running    -> listening
    //   agents working                -> executing
    // Anything else would be decoration pretending to be status.
    const anyW = busy > 0;
    $("#orbDot").className = "dot " + (anyW ? "warn" : "on");
    $("#orbTxt").textContent = anyW ? `${busy} WORKING`
                         : (sessionOn ? "LISTENING" : "IDLE");
    $("#coreState").textContent = ps.length + " agents · " + busy + " working";
    drawDesks(ps);
  }catch(e){ $("#vDot").className="dot err"; $("#vTxt").textContent="bridge down"; }
}

/* ── agent town: pixel sprites driven by REAL /state ───────────────────── */
let town = null, townBusy = 0;
try {
  town = createTown($("#townCanvas"), busy => {
    townBusy = busy;
    const s = $("#sBusy"); if (s) s.textContent = busy;
  });
  town.start();
  const rd = $("#townReady"); if (rd) rd.textContent = "ready";
  log("agent town ready","ok");
} catch(e) {
  log("agent town failed: "+e.message,"bad");
  $("#townbody").innerHTML = `<div style="padding:20px;color:var(--rd)">${e.message}</div>`;
}

function drawDesks(ps){ if (town) town.update(ps); }

/* ── live event stream ─────────────────────────────────── */
const seen = new Set();
function wireEvents(){
  const es = new EventSource("/events");
  es.onopen = ()=>{ $("#vDot").className="dot on"; $("#vTxt").textContent="live";
                     $("#sDot").className="dot on"; $("#sOnline").textContent="online"; };
  es.onerror = ()=>{ $("#vDot").className="dot warn"; $("#vTxt").textContent="reconnecting";
                     $("#sDot").className="dot warn"; $("#sOnline").textContent="reconnecting"; };
  es.onmessage = ev=>{
    let d; try{ d = JSON.parse(ev.data); }catch{ return; }
    const list = d.events || [];
    for (const e of list.slice(-6)){
      const id = e.id || JSON.stringify(e);
      if (seen.has(id)) continue; seen.add(id);
      const t = e.type || e.kind || "event";
      log(`${t} ${e.task||e.assignee||""}`.trim(),
          t==="completed"?"ok": t==="failed"?"bad": t==="claimed"||t==="spawned"?"work":"info");
    }
  };
}

/* ── MEDIA LINK: the real webcam, as an MJPEG <img> ─────────────────────
   Starts ONLY when the human presses START. The camera is not left running
   because a tab was once open: the panel calls /cam/stop when toggled off,
   and the bridge reaps ffmpeg when the client disconnects (measured: 0
   orphans after a client vanished mid-stream). */
let camOn = false;
function camStart(){
  const img = $("#camFeed");
  camOn = true;
  $("#camToggle").textContent = "STOP";
  $("#camToggle").classList.add("on");
  $("#camState").textContent = "connecting…";
  $("#camErr").hidden = true;
  $("#camOff").hidden = true;
  img.hidden = false;
  // Confirm by the frame actually arriving, not by the request having been made.
  // An <img> fed by multipart/x-mixed-replace fires load once the first frame
  // is decoded, so this is real evidence rather than a hopeful status line.
  img.onload = () => { $("#camState").textContent = "online"; };
  img.onerror = () => {
    $("#camState").textContent = "offline";
    $("#camErr").hidden = false;
    // The bridge now answers 503 with ffmpeg's own reason (measured:
    // "Error opening input: Device or resource busy."), but an <img> cannot read
    // a response body, so name both causes here rather than spend a second
    // request to ask. The usual one is GESTURE holding /dev/video0 - it is
    // single-client on this box and gesture control runs as a service.
    $("#camErr").textContent = "Camera unavailable — /dev/video0 is held by another process. Stop GESTURE first.";
    camStop();
  };
  img.src = "/cam?cb=" + Date.now();
}
function camStop(){
  const img = $("#camFeed");
  img.onload = null; img.onerror = null;
  img.removeAttribute("src");     // closes the socket -> bridge reaps ffmpeg
  img.hidden = true;
  $("#camOff").hidden = false;
  camOn = false;
  $("#camToggle").textContent = "START";
  $("#camToggle").classList.remove("on");
  $("#camState").textContent = "offline";
  fetch("/cam/stop").catch(()=>{});
}
$("#camToggle").onclick = () => camOn ? camStop() : camStart();

/* ── the chat box: typed commands and file uploads ─────────────────────
   Text goes through the SAME /say + /task path the voice loop uses, so this
   is reuse rather than a second conversation mechanism: POST /say creates a
   real Kanban task for the CEO, GET /task reads the worker's own summary back.
   Files go to /upload, which streams to ~/helix/inbox and hands the path to the
   document profile. */
const H = {"X-Helix-Voice": "1"};
let busyChat = false;

function addMsg(who, text, att){
  const d = document.createElement("div");
  d.className = "msg " + who;
  const label = {me:"YOU", ai:"HELIX", sys:"SYSTEM"}[who] || who;
  d.innerHTML = `<div class="who">${label}</div><div class="bub"></div>`;
  d.querySelector(".bub").textContent = text;
  if (att) {
    const a = document.createElement("div");
    a.className = "att";
    a.textContent = "\u{1F4CE} " + att;
    d.querySelector(".bub").appendChild(a);
  }
  $("#stream").appendChild(d);
  $("#stream").scrollTop = $("#stream").scrollHeight;
  return d;
}

async function ask(text){
  if (busyChat || !text.trim()) return;
  busyChat = true;
  $("#send").disabled = true; $("#typebox").disabled = true;
  addMsg("me", text);
  const pending = addMsg("ai", "\u2026 Helix is working on it\u2026");
  let res, id = null;
  try {
    res = await (await fetch("/say", {method:"POST", headers:{...H, "Content-Type":"application/json"},
                                   body: JSON.stringify({text})})).json();
    id = res.task;
  } catch(e) {
    pending.querySelector(".bub").textContent = "Could not reach Helix: " + e.message;
    busyChat = false; $("#send").disabled = false; $("#typebox").disabled = false;
    return;
  }
  if (!id) {
    pending.querySelector(".bub").textContent = (res && res.error) || "No task was created.";
    busyChat = false; $("#send").disabled = false; $("#typebox").disabled = false;
    return;
  }
  // poll for the worker's own summary, then give up LOUDLY rather than spinning
  const deadline = Date.now() + 240000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 2000));
    let t;
    try { t = await (await fetch("/task?id=" + encodeURIComponent(id))).json(); } catch(e) { continue; }
    if (t.status === "done"){ pending.querySelector(".bub").textContent = t.summary || "(no summary)"; break; }
    if (t.status === "failed" || t.status === "archived"){
      pending.querySelector(".bub").textContent = "Helix could not do this: " + (t.summary || t.status); break; }
  }
  if (Date.now() >= deadline) pending.querySelector(".bub").textContent =
    "Still running after 4 minutes — it has not failed, I just stopped waiting. Task " + id;
  busyChat = false;
  $("#send").disabled = false; $("#typebox").disabled = false;
}

async function upload(file){
  const fd = new FormData();
  fd.append("text", $("#typebox").value || "");
  fd.append("file", file, file.name);
  const mb = (file.size/1048576).toFixed(2);
  const hold = addMsg("sys", `Uploading ${file.name} (${mb} MB)…`);
  try {
    const r = await (await fetch("/upload", {method:"POST", headers:H, body:fd})).json();
    if (!r.ok){ hold.querySelector(".bub").textContent = "Upload failed: " + r.error; return; }
    hold.querySelector(".bub").textContent = "Sent to Helix.";
    addMsg("me", "Sent you a file.", `${r.name} · ${mb} MB`);
    $("#typebox").value = "";
    if (r.task){
      const pending = addMsg("ai", "\u2026 Helix is reading it\u2026");
      const deadline = Date.now() + 300000;
      while (Date.now() < deadline) {
        await new Promise(r2 => setTimeout(r2, 2500));
        let t;
        try { t = await (await fetch("/task?id=" + encodeURIComponent(r.task))).json(); } catch(e) { continue; }
        if (t.status === "done"){ pending.querySelector(".bub").textContent = t.summary || "(done, no summary)"; break; }
        if (t.status === "failed" || t.status === "archived"){
          pending.querySelector(".bub").textContent = "Could not process it: " + (t.summary || t.status); break; }
      }
      if (Date.now() >= deadline) pending.querySelector(".bub").textContent =
        "Still working on it. Task " + r.task;
    }
  } catch(e){ hold.querySelector(".bub").textContent = "Upload failed: " + e.message; }
}

$("#send").onclick = () => { const v = $("#typebox").value; $("#typebox").value = ""; ask(v); };
$("#typebox").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#send").click(); } });
$("#attach").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => { const f = e.target.files[0]; if (f) upload(f); e.target.value = ""; };
// paste an image straight into the box
$("#typebox").addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items||[])].find(i => i.type.startsWith("image/"));
  if (it){ e.preventDefault(); upload(it.getAsFile()); } });

/* ── gesture control: webcam hand tracking drives the orb ────────────────
   Events come from tools/gesture.py over SSE (127.0.0.1:8789). One hand pinched
   = grab, motion rotates; two hands = their spacing zooms; a fist releases.
   The orb already exposes rotateBy/zoomIn/zoomOut, so nothing about the orb had
   to change - only who calls it. */
const GESTURE_URL = "http://127.0.0.1:8789/events";
let gES = null;

const gestBtn = () => $("#gestToggle");
const gestStat = () => $("#gestStatus");

function gestureOff(){
  if (gES){ gES.close(); gES = null; }
  const b = gestBtn();
  if (b){ b.classList.remove("live","arm"); b.textContent = "GESTURE"; }
  const st = gestStat();
  if (st) st.textContent = "";
  // The bridge owns the detector process; this is what actually releases the
  // camera. Stopping the EventSource alone would leave it holding /dev/video0.
  fetch("/gesture", {method:"POST", headers:{...H, "Content-Type":"application/json"},
                     body: JSON.stringify({on:false})}).catch(()=>{});
}

function gestureOn(){
  const b = gestBtn(), st = gestStat();
  if (!b || gES) return;
  b.classList.add("live"); b.textContent = "STOP GEST";
  st.textContent = "starting camera…";
  // Ask the bridge to start the detector FIRST. It waits for the port to answer
  // before replying, so opening the EventSource after this cannot race startup
  // and land on connection-refused.
  fetch("/gesture", {method:"POST", headers:{...H, "Content-Type":"application/json"},
                     body: JSON.stringify({on:true})})
    .then(r => r.json())
    .then(d => { if (!d.ok) throw new Error(d.detail || "start failed"); startStream(); })
    .catch(e => {
      if (st) st.textContent = "gesture: " + e.message;
      if (b){ b.classList.remove("live"); b.classList.add("arm"); }
    });
}

function startStream(){
  const b = gestBtn(), st = gestStat();
  gES = new EventSource(GESTURE_URL);
  // State frames are written as bare `data:` lines with no `event:` name, so the
  // browser delivers them as the default "message" event. Listening for a named
  // "state" event silently never fired.
  gES.onmessage = e => {
    let d; try{ d = JSON.parse(e.data); }catch{ return; }
    if (!st) return;
    if (d.error){ st.textContent = "gesture: " + d.error;
                  b && b.classList.add("arm"); return; }
    const g = d.last_gesture;
    st.textContent = `${d.hands} hand${d.hands===1?"":"s"} · ${d.fps}fps · ${g}`;
    st.style.color = g === "drag" ? "var(--am)" : g === "zoom" ? "var(--cy)" : "var(--dim)";
  };
  gES.addEventListener("drag", e=>{
    let d; try{ d = JSON.parse(e.data); }catch{ return; }
    if (orb) orb.rotateBy(d.dx * 2.2, d.dy * 2.2);
  });
  gES.addEventListener("zoom", e=>{
    let d; try{ d = JSON.parse(e.data); }catch{ return; }
    if (!orb) return;
    if (d.delta > 0.008) orb.zoomIn(); else if (d.delta < -0.008) orb.zoomOut();
  });
  gES.onerror = () => {
    if (st) st.textContent = "gesture service unreachable";
    if (b){ b.classList.remove("live"); b.classList.add("arm"); }
    if (gES){ gES.close(); gES = null; }
  };
}
$("#gestToggle").onclick = () => gES ? gestureOff() : gestureOn();

/* ── real tool calls, from state.db via /activity ────────────────────── */
let actMode = "voice";
const esc = s => String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hhmm = ts => { try { return new Date(ts*1000).toTimeString().slice(0,8); } catch { return ""; } };

let _actTimer = 0;
function startActivityPoll(){
  clearInterval(_actTimer);
  // The panel used to render once and then never update, so live agent work was
  // invisible until you re-selected the tab.
  _actTimer = setInterval(() => { if (actMode === "agent") activity(); }, 6000);
}

async function activity(){
  const el = $("#toolsView");
  el.innerHTML = '<div class="ev info"><div class="bd">loading real tool calls…</div></div>';
  let d;
  try { d = await (await fetch("/activity")).json(); }
  catch(e){ el.innerHTML = `<div class="ev bad"><div class="bd">activity: ${esc(e.message)}</div></div>`; return; }
  const calls = d.calls || [];
  if (!calls.length){ el.innerHTML = '<div class="ev info"><div class="bd">No tool calls recorded yet.</div></div>'; return; }
  el.innerHTML = calls.map(c => `
    <div class="call">
      <div class="ch"><b>${esc(c.tool)}</b><span class="pf">${esc(c.profile)}</span>
        <span class="tm">${hhmm(c.ts)}</span></div>
      <div class="blk"><div class="lb">INPUT</div><pre>${esc(c.args)||"{}"}</pre></div>
      <div class="blk out"><div class="lb">OUTPUT</div><pre>${esc(c.result)||"(empty)"}</pre></div>
    </div>`).join("");
  $("#actCount").textContent = calls.length + " calls";
}

/* ── headlines ─────────────────────────────────────────── */
async function headlines(){
  try{
    const r = await fetch("/headlines"), d = await r.json();
    // Real shape is {ts, feeds:[{source, error, items:[{title,link,date}]}], total}
    // - items are nested per feed, there is no top-level items array. My first
    // parser looked for d.items and rendered 0 stories against a 200 response.
    const items = (d.feeds||[]).flatMap(f => (f.items||[]).map(s => Object.assign({}, s, {source: f.source})));
    $("#hlCount").textContent = items.length + " stories";
    $("#headlines").innerHTML = items.slice(0,16).map((s,i)=>
      `<div class="it"><span class="n">${String(i+1).padStart(2,"0")}</span>
        <div><a href="${s.link}" target="_blank" rel="noopener">${s.title}</a>
        <div class="src">${s.source||""}</div></div></div>`).join("");
  }catch(e){ log("headlines: "+e.message,"bad"); }
}

/* ── globe 2D/3D, reuse the installed app ──────────────── */
document.querySelectorAll("#mapModes button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#mapModes button").forEach(x=>x.setAttribute("aria-selected", x===b));
  const q = b.dataset.m==="2d" ? "pitch=-90&heading=0&map=esri-imagery" : "";
  $("#globe").src = `http://127.0.0.1:4173/?cb=2&welcome=0&clean=1${q?"&"+q:""}`;
});

/* ── tabs (visual hub / gesture are phases 2+, honest here) ── */
document.querySelectorAll("#townhead .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#townhead .tab").forEach(x=>x.setAttribute("aria-selected", x===b));
  const note = $("#townNote");
  if (b.dataset.t!=="agents"){
    if (town) town.stop();
    log(`${b.dataset.t}: not built yet — honest, not faked`,"info");
    note.querySelector("b").textContent = b.dataset.t;
    note.querySelector("span").textContent =
      "Not implemented yet. Showing an honest placeholder rather than a mock pretending to be live data.";
    note.hidden = false;
  } else {
    note.hidden = true;
    if (town) town.start();
    state();
  }
});
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs .tab").forEach(x=>x.setAttribute("aria-selected", x===b));
  actMode = b.dataset.c;
  const which = { voice:"#stream", agent:"#toolsView", notes:"#notesView" }[b.dataset.c];
  ["#stream","#toolsView","#notesView"].forEach(id =>
    document.querySelector(id).hidden = (id !== which));
  $("#composer").hidden = b.dataset.c !== "voice";
  if (b.dataset.c === "agent"){ activity(); startActivityPoll(); }
  else clearInterval(_actTimer);
});
$("#chatBtn").onclick = ()=> log("text chat not built yet — voice/whatsapp are the live channels","info");

/* start/stop is honest: it reports what it actually does */
$("#startbtn").onclick = ()=>{
  sessionOn = $("#startbtn").classList.toggle("stop");
  $("#startbtn").textContent = sessionOn ? "STOP AI" : "START AI";
  state();   // re-derives LISTENING vs IDLE from the flag just flipped
  log(sessionOn ? "session requested — voice core runs at /voice-core/"
                : "session released","info");
};

// Open on AGENT, so the console shows real tool calls on load rather than an
// empty column. Still driven by /activity - no demo cards.
activity();
cortex(); state(); headlines(); wireEvents();
setInterval(state, 4000);
setInterval(cortex, 15000);
setInterval(headlines, 300000);
log("console booted","ok");
