<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix — World Monitor</title>
<style>
  :root {
    --bg:#0b0e13; --panel:#131820; --line:#232a33; --text:#e6edf3; --dim:#8b949e;
    --accent:#58a6ff; --live:#3fb950;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh; display:flex;
         flex-direction:column; overflow:hidden;
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:14px; padding:14px 20px;
           border-bottom:1px solid var(--line); flex:none; }
  h1 { font-size:14px; letter-spacing:.2em; text-transform:uppercase; margin:0; }
  .sub { color:var(--dim); font-size:11px; }
  .sub b { color:var(--accent); font-weight:600; }
  #age { margin-left:auto; font-size:11px; color:var(--dim); }
  main { flex:1; display:flex; min-height:0; }
  #globe { flex:1; border:0; background:#000; }
  aside { width:360px; flex:none; border-left:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; min-height:0; }
  aside h2 { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
             margin:0; padding:13px 16px; border-bottom:1px solid var(--line); font-weight:600;
             display:flex; align-items:center; gap:8px; }
  #dot { width:6px; height:6px; border-radius:50%; background:var(--live);
         animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  #feed { overflow-y:auto; padding:6px 0; flex:1; }
  .src { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
         padding:14px 16px 5px; }
  a.item { display:block; padding:7px 16px; color:var(--text); text-decoration:none;
           font-size:12.5px; border-left:2px solid transparent; }
  a.item:hover { background:#1a212b; border-left-color:var(--accent); }
  a.item small { display:block; color:var(--dim); font-size:10.5px; margin-top:2px; }
  .dead { padding:10px 16px; color:#d29922; font-size:11px; }
  #err { color:#f85149; padding:10px 16px; font-size:12px; }
</style>
</head>
<body>
  <header>
    <h1>Helix · World Monitor</h1>
    <span class="sub">globe: <b>God's Eye View</b> @ 127.0.0.1:4173 · headlines: <b>bridge</b> /headlines</span>
    <span id="age">loading…</span>
  </header>
  <main>
    <!-- Own static page, no shared shell with Agent Town yet (spec: keep separate for now). -->
    <!-- cb= forces a re-fetch: a previously cached 4173 response still carries the old
         X-Frame-Options/CSP headers, which render this frame black. -->
    <iframe id="globe" src="http://127.0.0.1:4173/?cb=1" title="God's Eye View globe"
            allow="fullscreen; geolocation"></iframe>
    <aside>
      <h2><span id="dot"></span>Live headlines</h2>
      <div id="err" hidden></div>
      <div id="feed"></div>
    </aside>
  </main>

<script>
const feed = document.getElementById("feed");
const err = document.getElementBoxById?.("err") || document.getElementById("err");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function render(d) {
  const dead = d.feeds.filter(f => f.error);
  if (dead.length === d.feeds.length) {
    err.textContent = "all feeds unreachable: " + dead[0].error;
    err.hidden = false;
    return;
  }
  err.hidden = true;
  feed.innerHTML = d.feeds.map(f => {
    const head = `<div class="src">${esc(f.source)}</div>`;
    if (f.error) return head + `<div class="dead">unreachable — ${esc(f.error)}</div>`;
    return head + f.items.map(i =>
      `<a class="item" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}
        <small>${esc(i.date)}</small></a>`).join("");
  }).join("");
  document.getElementById("age").textContent =
    d.total + " stories · " + new Date(d.ts * 1000).toLocaleTimeString();
}

async function load() {
  try { render(await (await fetch("/headlines")).json()); }
  catch (e) { err.textContent = "bridge unreachable — " + e; err.hidden = false; }
}
load();
setInterval(load, 300000);  // matches the bridge's 5-min cache
</script>
</body>
</html>
